name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: niivora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d niivora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/niivora
      AUTH_SECRET: ci-only-secret
      AUTH_GOOGLE_ID: ci-google-id
      AUTH_GOOGLE_SECRET: ci-google-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate --config prisma7.config.ts
      - name: Generate Prisma client
        run: npx prisma generate --config prisma7.config.ts
      - name: Apply migrations to clean database
        run: npx prisma migrate deploy --config prisma7.config.ts
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
